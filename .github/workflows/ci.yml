name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for the tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: python -m pytest -q -rfE --junitxml=pytest.xml || { python scripts/ci_annotate.py pytest.xml; exit 1; }

  official-mcp-client:
    name: official MCP clients (1.x and 2.x)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mcp: ["mcp<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
      - run: python -m pip install -e ".[dev]" "${{ matrix.mcp }}"
      - run: python -m pytest -q tests/test_mcp.py

  install-from-wheel:
    name: install like a user
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and install into a clean environment
        shell: bash
        run: |
          python -m pip wheel . -w dist --no-deps
          python -m venv /tmp/rtvenv || python -m venv rtvenv
          if [ -d /tmp/rtvenv ]; then V=/tmp/rtvenv; else V=rtvenv; fi
          if [ -f "$V/bin/python" ]; then PY="$V/bin/python"; else PY="$V/Scripts/python.exe"; fi
          "$PY" -m pip install dist/*.whl
          mkdir proj && cd proj
          git init -q -b main
          git -c user.name=CI -c user.email=ci@example.com commit -q --allow-empty -m init
          "$PY" -m roundtable_ai --version
          "$PY" -m roundtable_ai init
          "$PY" -m roundtable_ai seat add opus --model claude-opus-5-5 --app claude-code
          "$PY" -m roundtable_ai doctor
